<p-toast></p-toast>
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight">Profile</h1>

  @if (isLoading || (auth.isLoading$ | async)) {
    <p class="mt-6 text-muted-color">Loading…</p>
  } @else if (error) {
    <p-message class="mt-6 block" severity="error">{{ error }}</p-message>
  } @else if (user) {
    <form class="mt-6 flex flex-col gap-1.5" (ngSubmit)="updateUser()">
      <label class="text-sm font-medium" for="dn">Display name</label>
      <input
        id="dn"
        name="displayName"
        pInputText
        [(ngModel)]="user.displayName"
        minlength="3"
        maxlength="30"
        required
        autocomplete="nickname"
      />
      <small class="text-sm text-muted-color">Shown next to your comments. At least 3 characters.</small>
      <div class="mt-4 flex justify-end">
        <p-button type="submit" label="Save" [disabled]="!user.displayName || user.displayName.length < 3"></p-button>
      </div>
    </form>
  }
</div>
