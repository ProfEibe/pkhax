<div class="inline-flex justify-start items-center">
  <p-rating
    [(ngModel)]="value"
    (mouseenter)="hover = true"
    (mouseleave)="hover = false"
    [readonly]="readOnly()"
  ></p-rating>
  ({{ ratings().length }})
  @if (!readOnly()) {
    <button
      pButton
      pRipple
      aria-label="Save rating"
      (click)="saveRating()"
      type="button"
      icon="pi pi-check"
      [disabled]="!ownValue()"
      class="p-button-rounded p-button-text"
    ></button>
  }
</div>
