<div class="flex flex-wrap items-center gap-x-3 gap-y-2">
  <p-rating
    [(ngModel)]="value"
    (mouseenter)="hover = true"
    (mouseleave)="hover = false"
    [readonly]="readOnly()"
    [attr.aria-label]="readOnly() ? 'Average rating' : 'Your rating'"
  ></p-rating>
  <span class="text-sm text-muted-color tabular-nums">
    @if (ratings().length) {
      {{ avgValue() | number: '1.1-1' }} · {{ ratings().length }} {{ ratings().length === 1 ? 'vote' : 'votes' }}
    } @else {
      No votes yet
    }
  </span>
  @if (!readOnly() && ownValue()) {
    <p-button label="Save rating" size="small" (onClick)="saveRating()"></p-button>
  }
</div>
